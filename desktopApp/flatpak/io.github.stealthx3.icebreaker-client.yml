# Beta manifest: packages the jlink distributable that `./gradlew :desktopApp:createDistributable`
# builds on the host (scripts/desktop/flatpak/build-alpha.sh). The offline, from-source build
# Flathub needs is Phase 5. SDL3, libdbus and libsecret come from the 26.08 runtime.
app-id: io.github.stealthx3.icebreaker-client
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: icebreaker
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=all
  - --socket=pulseaudio
  - --filesystem=~/Games/IceBreaker:create
  - --filesystem=~/.steam:rw
  - --filesystem=~/.steam/steam:rw
  - --filesystem=~/.var/app/com.valvesoftware.Steam:rw
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  - --talk-name=org.freedesktop.Flatpak
  # Emulator save and state folders save sync reads and writes in place (HostSavePaths,
  # RetroArchHostLayout): EmuDeck links, each mapped emulator's Flatpak tree, then native folders.
  - --filesystem=~/Emulation
  - --filesystem=~/.var/app/org.libretro.RetroArch
  - --filesystem=~/.var/app/org.DolphinEmu.dolphin-emu
  - --filesystem=~/.var/app/info.cemu.Cemu
  - --filesystem=~/.var/app/org.azahar_emu.Azahar
  - --filesystem=~/.var/app/io.github.ryubing.Ryujinx
  - --filesystem=~/.var/app/dev.eden_emu.eden
  - --filesystem=~/.var/app/org.duckstation.DuckStation
  - --filesystem=~/.var/app/net.pcsx2.PCSX2
  - --filesystem=~/.var/app/org.ppsspp.PPSSPP
  - --filesystem=~/.var/app/net.rpcs3.RPCS3
  - --filesystem=xdg-config/retroarch
  - --filesystem=xdg-config/Ryujinx
  - --filesystem=xdg-config/PCSX2
  - --filesystem=xdg-config/ppsspp
  - --filesystem=xdg-config/rpcs3
  - --filesystem=xdg-data/Cemu
  - --filesystem=xdg-data/azahar-emu
  - --filesystem=xdg-data/eden
  - --filesystem=xdg-data/duckstation
  - --filesystem=xdg-data/Vita3K
  - --filesystem=xdg-data/dolphin-emu
  - --filesystem=~/.dolphin-emu
modules:
  # libmpv for video wallpaper and trailers (Phase 4 step 9), library only: no player, no Lua.
  - name: libass
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=enabled
      - -Dd3d11=disabled
      - -Ddemos=false
      - -Dtests=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: 719cc95244a1f1d648dd72459822e026e6530f22
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dvulkan=disabled
      - -Duchardet=disabled
      - -Dzimg=disabled
      - -Dlibarchive=disabled
      - -Dcdda=disabled
      - -Ddvdnav=disabled
      - -Dlibbluray=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
  # Sigil's JNI library (title ids and save layouts), built with sigil's own CMake against the
  # runtime; FindJNI needs only the headers, the JVM and AWT library paths are never linked.
  - name: sigil-jni
    buildsystem: simple
    build-commands:
      - cmake -S sigil -B build -DSIGIL_BUILD_JNI_HOST=ON -DCMAKE_BUILD_TYPE=Release
          -DJAVA_INCLUDE_PATH=$PWD/jni-include -DJAVA_INCLUDE_PATH2=$PWD/jni-include/linux
          -DJAVA_AWT_INCLUDE_PATH=$PWD/jni-include -DJAVA_AWT_LIBRARY=unused -DJAVA_JVM_LIBRARY=unused
      - cmake --build build --target sigil_jni_host -j $FLATPAK_BUILDER_N_JOBS
      - install -Dm755 build/bindings/libsigil-jni.so -t /app/lib/icebreaker/lib/app
    sources:
      - type: dir
        path: ../../sigil
        dest: sigil
      - type: dir
        path: ../build/jni-include
        dest: jni-include
  - name: steam-shortcut
    buildsystem: simple
    build-commands:
      - install -Dm755 add_to_steam.py ${FLATPAK_DEST}/bin/${FLATPAK_ID}-steam
      - install -Dm644 -t ${FLATPAK_DEST}/share/${FLATPAK_ID}/steam steam-shortcut.json
          capsule-600x900.png header-920x430.png hero-3840x1240.png logo-1280x720.png icon-256.png
    sources:
      - type: dir
        path: ../../packaging/steam
  - name: icebreaker
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/icebreaker
      - cp -a distributable/. /app/lib/icebreaker/
      - install -Dm755 icebreaker.sh /app/bin/icebreaker
      - install -Dm644 io.github.stealthx3.icebreaker-client.desktop -t /app/share/applications
      - install -Dm644 io.github.stealthx3.icebreaker-client.metainfo.xml -t /app/share/metainfo
      - mkdir -p /app/share/icons && cp -r icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: ../build/compose/binaries/main/app/icebreaker
        dest: distributable
      - type: file
        path: icebreaker.sh
      - type: file
        path: io.github.stealthx3.icebreaker-client.desktop
      - type: file
        path: io.github.stealthx3.icebreaker-client.metainfo.xml
      - type: dir
        path: icons
        dest: icons
